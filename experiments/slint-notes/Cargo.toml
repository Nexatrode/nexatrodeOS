[package]
name = "personal-os-slint-notes-spike"
version = "0.1.0"
edition = "2024"
publish = false

[features]
iphone-pd = []
pixel-pd = []
pixel-notes-smoke = ["pixel-pd"]
workspace-ui = []
full-suite-ui = []
simplex-agent-ui = []
simplex-cli-qemu-test = []
utm-file-import-test = []
utm-files-selftest = ["utm-file-import-test"]
utm-chat-list-selftest = []
utm-chat-sync-selftest = []
utm-keyboard-selftest = []
utm-clock-selftest = []
utm-perf-trace = []
utm-photo-worker = ["simplex-agent-ui"]
utm-transcript-worker = ["simplex-agent-ui"]
utm-pd = []
desktop-dynamic-ui = ["utm-pd"]
desktop-shell-ui = ["utm-pd"]
desktop-shell-app = ["utm-pd"]
desktop-shell-2x = []
desktop-real-app = ["utm-pd", "full-suite-ui"]
desktop-apps-observe = ["desktop-real-app"]
desktop-browser-shell = ["desktop-apps-shell"]
desktop-apps-shell = ["desktop-shell-ui", "desktop-shell-2x"]
desktop-chat-window = ["desktop-real-app", "desktop-simplex-frontend"]
desktop-wallet-window = ["desktop-real-app"]
desktop-lock-app = ["desktop-dynamic-ui"]
desktop-private-notes = ["desktop-lock-app"]
desktop-simplex-frontend = ["utm-pd", "full-suite-ui", "utm-photo-worker", "utm-transcript-worker"]
desktop-simplex-live-test = ["utm-pd", "utm-photo-worker", "utm-transcript-worker"]
desktop-lock-ui = ["utm-pd", "utm-device-lock"]
desktop-wrapped-lock-ui = ["desktop-lock-ui", "personal-os-rust-server/utm-dynamic-vault-lock"]
utm-device-lock = ["personal-os-rust-server/utm-device-lock"]
utm-wrapped-vault-experiment = ["utm-device-lock", "personal-os-rust-server/utm-wrapped-vault-experiment"]
utm-nexawal-rpc-bridge = []
full-suite-profile = ["full-suite-ui", "frame-timing"]
full-suite-input-profile = ["full-suite-profile"]
full-suite-press-click = ["full-suite-profile"]
full-suite-queued-touch = ["full-suite-press-click"]
full-suite-snapshot-boot = ["full-suite-ui", "snapshot-boot"]
full-suite-half-res = ["full-suite-profile"]
full-suite-two-thirds = ["full-suite-profile"]
full-suite-two-thirds-row-copy = ["full-suite-two-thirds"]
frame-timing = ["iphone-pd"]
stage-timing = ["frame-timing"]
line-timing = ["frame-timing"]
fill-timing = ["frame-timing"]
row-copy = ["frame-timing"]
raster-profile = ["frame-timing"]
snapshot-boot = ["frame-timing"]

[[bin]]
name = "slint_notes_iphone"
path = "src/iphone.rs"
required-features = ["iphone-pd"]

[[bin]]
name = "slint_notes_pixel"
path = "src/pixel.rs"
required-features = ["pixel-pd"]

[[bin]]
name = "slint_photo_reader"
path = "src/photo_reader.rs"
required-features = ["utm-photo-worker"]

[[bin]]
name = "slint_photo_worker"
path = "src/photo_worker.rs"
required-features = ["utm-photo-worker"]

[[bin]]
name = "slint_transcript_worker"
path = "src/transcript_worker.rs"
required-features = ["utm-transcript-worker"]

[[bin]]
name = "slint_notes_utm"
path = "src/utm.rs"
required-features = ["utm-pd", "full-suite-ui"]

[[bin]]
name = "slint_lifecycle_lock"
path = "../desktop-lock/auth.rs"
required-features = ["desktop-lock-ui"]

[[bin]]
name = "simplex_session_client"
path = "../desktop-simplex/client.rs"
required-features = ["utm-pd", "utm-photo-worker", "utm-transcript-worker"]

[[bin]]
name = "simplex_live_client"
path = "../desktop-simplex/live_client.rs"
required-features = ["desktop-simplex-live-test"]

[[bin]]
name = "desktop_shell"
path = "../desktop-shell/shell.rs"
required-features = ["desktop-shell-ui"]

[[bin]]
name = "slint_surface_fixture"
path = "../../experiments/desktop-surfaces/app.rs"
required-features = ["utm-pd"]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["renderer-software", "unsafe-single-threaded", "libm", "compat-1-18"] }
zune-jpeg = { version = "=0.5.15", default-features = false }
qrcodegen-no-heap = { version = "=1.8.1", default-features = false }
zeroize = { version = "=1.9.0", default-features = false }

[build-dependencies]
slint-build = "=1.18.1"

[target.'cfg(target_os = "none")'.dependencies]
sel4-config = { git = "https://github.com/seL4/rust-sel4", rev = "891b59622306e94ad428193838f0d6214bb5c7aa" }
libm = { version = "=0.2.16", default-features = false }
personal-os-rust-server = { path = "../../rust" }
sel4-microkit = { git = "https://github.com/seL4/rust-sel4", rev = "891b59622306e94ad428193838f0d6214bb5c7aa" }
sel4-dlmalloc = { git = "https://github.com/seL4/rust-sel4", rev = "891b59622306e94ad428193838f0d6214bb5c7aa" }
