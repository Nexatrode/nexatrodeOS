[package]
name = "nexatrode-guest-https"
version = "0.1.0"
edition = "2021"
publish = false

[features]
browser-test-ca = []

[dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "tls12"] }
ring = { version = "=0.17.14", default-features = false, features = ["alloc", "less-safe-getrandom-custom-or-rdrand"] }
getrandom = { version = "=0.2.17", features = ["custom"] }
webpki-roots = "=1.0.11"
