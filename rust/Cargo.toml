[dependencies]
aes = { version = "=0.9.3", default-features = false, features = ["zeroize"] }
aes-gcm-siv = { version = "=0.12.1", default-features = false, features = ["aes"] }
hmac = { version = "=0.12.1", default-features = false }
pbkdf2 = { version = "=0.12.2", default-features = false, features = ["hmac"] }
sha1 = { version = "=0.10.7", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "=1.9.0", default-features = false }

[target.'cfg(target_os = "none")'.dependencies]
sel4 = { git = "https://github.com/seL4/rust-sel4", rev = "891b59622306e94ad428193838f0d6214bb5c7aa" }
sel4-microkit = { git = "https://github.com/seL4/rust-sel4", rev = "891b59622306e94ad428193838f0d6214bb5c7aa" }

[lib]
path = "src/lib.rs"
